  </head><body class="bg-surface-container-low text-on-surface font-body-md text-body-md min-h-screen flex flex-col antialiased selection:bg-secondary-container pt-safe pb-safe"><main class="flex-1 flex flex-col w-full px-margin bg-surface-container-low"><div class="flex flex-col w-full pb-8">
<!-- Top Navigation Bar -->
<div class="flex items-center justify-between py-space-sm mb-space-md">
<button aria-label="Вернуться назад" class="w-10 h-10 rounded-full bg-surface-container-lowest text-on-surface flex items-center justify-center transition-colors active:bg-surface-container" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container-lowest">
<span class="w-2 h-2 rounded-full bg-secondary-container"></span>
<span class="font-label-md text-label-md tracking-tight text-on-surface uppercase">Вжик</span>
</div>
<div class="w-10 h-10"></div>
</div>
<!-- Main Card Container -->
<div class="bg-surface-container-lowest rounded-2xl p-space-xl flex flex-col w-full">
<!-- Header Content -->
<div class="flex flex-col mb-space-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-space-xs">
        Введите код
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center flex-wrap gap-1">
<span>Мы отправили 6-значный код на</span>
<span class="font-medium text-on-surface inline-flex items-center gap-1 bg-surface-container-low px-2 py-0.5 rounded-lg">
<span class="material-symbols-outlined text-[15px] text-on-surface-variant">mail</span>
          name@mail.ru
        </span>
</p>
</div>
<!-- OTP 6-Digit Verification Inputs -->
<form class="flex flex-col gap-space-xl" id="otp-form">
<div class="flex justify-between items-center gap-1.5 sm:gap-2">
<input aria-label="Цифра 1" autocomplete="one-time-code" class="w-12 h-14 text-center font-display-lg text-[24px] rounded-xl bg-surface-container-low text-on-surface outline-none focus:bg-surface-container-high transition-colors" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="4"/>
<input aria-label="Цифра 2" class="w-12 h-14 text-center font-display-lg text-[24px] rounded-xl bg-surface-container-low text-on-surface outline-none focus:bg-surface-container-high transition-colors" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="8"/>
<input aria-label="Цифра 3" class="w-12 h-14 text-center font-display-lg text-[24px] rounded-xl bg-surface-container-low text-on-surface outline-none focus:bg-surface-container-high transition-colors" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="1"/>
<input aria-label="Цифра 4" autofocus="" class="w-12 h-14 text-center font-display-lg text-[24px] rounded-xl bg-surface-container text-on-surface outline-none focus:bg-surface-container-high transition-colors" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Цифра 5" class="w-12 h-14 text-center font-display-lg text-[24px] rounded-xl bg-surface-container-low text-on-surface outline-none focus:bg-surface-container-high transition-colors" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
<input aria-label="Цифра 6" class="w-12 h-14 text-center font-display-lg text-[24px] rounded-xl bg-surface-container-low text-on-surface outline-none focus:bg-surface-container-high transition-colors" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text"/>
</div>
<!-- Submit Action -->
<div class="flex flex-col gap-space-md pt-space-xs">
<button class="w-full py-4 bg-primary text-on-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center gap-2 active:bg-primary-container transition-colors" type="submit">
<span>Войти</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Timer / Resend Block -->
<div class="flex flex-col items-center justify-center text-center pt-space-xs">
<div class="flex items-center gap-1.5 font-body-sm text-body-sm text-on-surface-variant" id="countdown-block">
<span>Отправить код ещё раз через</span>
<span class="font-label-md text-label-md text-on-surface font-semibold" id="timer-text">0:42</span>
</div>
<button class="hidden font-label-md text-label-md text-on-surface underline underline-offset-4 py-1 active:opacity-60" id="resend-btn" type="button">
            Отправить код повторно
          </button>
</div>
</div>
</form>
</div>
<!-- Trust Banner / Context Note -->
<div class="mt-space-lg px-space-md py-space-sm bg-surface-container-lowest rounded-xl flex items-center gap-3">
<div class="w-8 h-8 rounded-lg bg-surface-container-low flex items-center justify-center shrink-0 text-on-surface">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface leading-tight">Быстрая авторизация</span>
<span class="font-body-sm text-body-sm text-on-surface-variant leading-snug truncate">Без паролей — просто одноразовый код</span>
</div>
</div>
</div>
<script>
  (function () {
    const inputs = Array.from(document.querySelectorAll('#otp-form input[type="text"]'));
    const timerText = document.getElementById('timer-text');
    const countdownBlock = document.getElementById('countdown-block');
    const resendBtn = document.getElementById('resend-btn');

    // Auto-advance between inputs
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val ? val[0] : '';
        if (val && index < inputs.length - 1) {
          inputs[index + 1].focus();
          inputs[index + 1].select();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
          inputs[index - 1].value = '';
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedData = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
        if (pastedData) {
          inputs.forEach((box, i) => {
            box.value = pastedData[i] || '';
          });
          const nextEmpty = inputs.find((box) => !box.value) || inputs[inputs.length - 1];
          nextEmpty.focus();
        }
      });
    });

    // Countdown logic
    let remainingSeconds = 42;
    const interval = setInterval(() => {
      remainingSeconds -= 1;
      if (remainingSeconds <= 0) {
        clearInterval(interval);
        countdownBlock.classList.add('hidden');
        resendBtn.classList.remove('hidden');
      } else {
        const secondsStr = remainingSeconds < 10 ? '0' + remainingSeconds : remainingSeconds;
        timerText.textContent = '0:' + secondsStr;
      }
    }, 1000);

    resendBtn.addEventListener('click', () => {
      remainingSeconds = 45;
      countdownBlock.classList.remove('hidden');
      resendBtn.classList.add('hidden');
      timerText.textContent = '0:45';
    });
  })();
</script></main></body></html>
